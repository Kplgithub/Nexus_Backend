name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: two overlapping builds on the server break each other.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      # Payment keys live only in GitHub secrets and the server .env, never in the repo.
      # Skipped when the secrets are not set.
      - name: Put Razorpay keys in the server .env
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RZP_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RZP_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: |
          if [ -z "$RZP_ID" ] || [ -z "$RZP_SECRET" ]; then
            echo 'Razorpay secrets not set, skipping'
            exit 0
          fi
          # The keys go over stdin, so they never appear in a command line.
          printf 'RAZORPAY_KEY_ID=%s\nRAZORPAY_KEY_SECRET=%s\n' "$RZP_ID" "$RZP_SECRET" |
            ssh -i ~/.ssh/id_deploy "$USER@$HOST" "
              set -eu
              f='$DEPLOY_PATH/apps/api/.env'
              tmp=\$(mktemp)
              grep -v -E '^RAZORPAY_KEY_(ID|SECRET)=' \"\$f\" > \"\$tmp\" || true
              cat >> \"\$tmp\"
              cat \"\$tmp\" > \"\$f\"
              rm -f \"\$tmp\"
              echo 'Razorpay keys updated'
            "

      - name: Deploy to Server via SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "
            export PATH=\$PATH:/usr/bin:/usr/local/bin
            set -euo pipefail
            cd '$DEPLOY_PATH'
            echo 'Fetching latest backend code...'
            git fetch origin main
            git reset --hard origin/main

            echo 'Installing dependencies...'
            pnpm install

            echo 'Building backend...'
            pnpm build

            echo 'Syncing database indexes...'
            node --env-file=apps/api/.env apps/api/dist/scripts/sync-indexes.js

            echo 'Adding keyword copy to empty location pages...'
            node --env-file=apps/api/.env apps/api/dist/scripts/apply-seo.js || echo 'seo:apply failed, continuing'

            echo 'Restarting nexus-api process...'
            pm2 restart nexus-api --update-env

            echo 'Waiting for API health check...'
            for i in \$(seq 1 30); do
              curl -fsS http://127.0.0.1:4000/api/v1/health && break
              [ \$i -eq 30 ] && { pm2 logs nexus-api --lines 50 --nostream; exit 1; }
              sleep 2
            done
            echo 'Backend deployment successful!'
          "
